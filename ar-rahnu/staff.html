<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Staff Console | Ar-Rahnu</title>
  <style>
    :root{--bg:#0b1320;--panel:#132236;--panel2:#0f1d2f;--line:#2b4363;--text:#eaf3fd;--muted:#9db6d3;--acc:#9ce84d}
    *{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(180deg,#0b1320,#0a1019);color:var(--text)}
    .app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
    .side{background:#0f1b2b;border-right:1px solid var(--line);padding:14px}
    .brand{font-size:20px;font-weight:800;margin:6px 0 16px}
    .menu button{width:100%;text-align:left;background:#15263b;border:1px solid #2d4563;color:#d9e8f8;padding:11px;border-radius:10px;margin-bottom:8px;cursor:pointer}
    .menu button.active{background:var(--acc);color:#15230d;border:none;font-weight:700}
    .main{padding:14px}
    .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:var(--panel2);border:1px solid #2e4463;border-radius:10px;padding:10px}.kpi b{font-size:24px}
    .row{display:flex;gap:8px;flex-wrap:wrap}input,select{padding:9px;border-radius:8px;border:1px solid #3a4d6c;background:#0f1724;color:#fff}
    button{padding:9px 12px;border:none;border-radius:8px;background:var(--acc);font-weight:700;color:#13200a;cursor:pointer}
    table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border-bottom:1px solid #2f3e59;padding:8px;text-align:left}
    .muted{color:var(--muted)} .hidden{display:none}
    @media(max-width:980px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:5}.kpis{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Staff Console</div>
    <div class="muted" id="mode"></div>
    <div class="menu" style="margin-top:10px">
      <button id="m-dashboard" class="active" onclick="show('dashboard')">Dashboard</button>
      <button id="m-add" onclick="show('add')">Add User</button>
      <button id="m-users" onclick="show('users')">User Management</button>
      <button id="m-subs" onclick="show('subs')">Subscription Management</button>
      <button id="m-profile" onclick="show('profile')">Profile Staff</button>
    </div>
  </aside>

  <main class="main">
    <div class="head"><h2 style="margin:0">Ar-Rahnu Staff Dashboard</h2><div id="msg" class="muted"></div></div>

    <section id="p-dashboard" class="card">
      <h3>Overview</h3>
      <div class="kpis" id="kpi"></div>
    </section>

    <section id="p-add" class="card hidden">
      <h3>Add / Update User</h3>
      <div class="row">
        <input id="uName" placeholder="Nama" />
        <input id="uEmail" placeholder="Email" />
        <input id="uPass" placeholder="Password (optional update)" />
        <select id="uPlan"><option value="basic">basic</option><option value="pro">pro</option><option value="vip">vip</option></select>
        <input id="uStart" type="date" />
        <input id="uExpire" type="date" />
        <select id="uActive"><option value="true">active</option><option value="false">inactive</option></select>
        <button onclick="saveUser()">Simpan</button>
      </div>
    </section>

    <section id="p-users" class="card hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <h3 style="margin:0">User Management</h3>
        <button onclick="show('add')">+ Add User</button>
      </div>
      <input id="search" placeholder="Cari user.." oninput="renderTable()" style="margin-top:8px" />
      <table><thead><tr><th>Email</th><th>Nama</th><th>Plan</th><th>Start</th><th>Expire</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table>
    </section>

    <section id="p-subs" class="card hidden">
      <h3>Subscription Management</h3>
      <div class="muted">User expired akan ada button follow-up WhatsApp.</div>
      <table><thead><tr><th>Email</th><th>Expire</th><th>Days Left</th><th>Follow Up</th></tr></thead><tbody id="subsRows"></tbody></table>
    </section>

    <section id="p-profile" class="card hidden">
      <h3>Profile Staff</h3>
      <p id="staffProfile" class="muted"></p>
    </section>
  </main>
</div>

<script>
const cfg=JSON.parse(localStorage.getItem('arrahnu_sync_cfg_v1')||'{}');
const token=localStorage.getItem('arrahnu_auth_token_v1')||'';
const profile=JSON.parse(localStorage.getItem('arrahnu_profile_v1')||'{}');
const base=(cfg.apiBase||'').replace(/\/$/,'');
const demoMode=!base||!token;
let users=JSON.parse(localStorage.getItem('demo_users_staff')||'[{"email":"user1@demo.my","full_name":"Ali","sub_plan":"basic","sub_start":"2026-05-01","sub_expire":"2026-06-01","is_active":true}]');

const msg=t=>document.getElementById('msg').textContent=t;
const daysLeft=dt=>dt?Math.ceil((new Date(dt)-new Date())/86400000):null;
const modeEl=document.getElementById('mode');
modeEl.textContent=demoMode?'Demo mode (tanpa login/backend)':'Live mode (backend connected)';

document.getElementById('staffProfile').textContent=`Nama/Email: ${profile.email||'staff.demo@arrahnu.my'} | Role: ${profile.role||'staff'}`;

async function api(path,opt={}){return fetch(base+path,{...opt,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...(opt.headers||{})}})}

function show(name){['dashboard','add','users','subs','profile'].forEach(x=>{document.getElementById('p-'+x).classList.toggle('hidden',x!==name);document.getElementById('m-'+x).classList.toggle('active',x===name)}); if(name==='subs') renderSubs();}

function renderKpi(){
  const total=users.length, active=users.filter(x=>x.is_active).length, expSoon=users.filter(x=>{const d=daysLeft(x.sub_expire);return d!==null&&d<=7&&d>=0}).length, expired=users.filter(x=>{const d=daysLeft(x.sub_expire);return d!==null&&d<0}).length;
  document.getElementById('kpi').innerHTML=`<div class='kpi'><small>Total User</small><br><b>${total}</b></div><div class='kpi'><small>Active</small><br><b>${active}</b></div><div class='kpi'><small>Expire ≤7 Hari</small><br><b>${expSoon}</b></div><div class='kpi'><small>Expired</small><br><b>${expired}</b></div>`;
}

function followBtn(u){const d=daysLeft(u.sub_expire); if(d===null||d>=0) return '-'; const txt=encodeURIComponent(`Hi ${u.full_name||'tuan/puan'}, subscription anda expired pada ${u.sub_expire}. Boleh renew semula hari ini ya.`); return `<a href='https://wa.me/?text=${txt}' target='_blank'><button>Wasap</button></a>`;}

function renderTable(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const list=users.filter(u=>`${u.email} ${u.full_name||''}`.toLowerCase().includes(q));
  document.getElementById('rows').innerHTML=list.map(u=>`<tr><td>${u.email}</td><td>${u.full_name||'-'}</td><td>${u.sub_plan||'-'}</td><td>${(u.sub_start||'').slice(0,10)||'-'}</td><td>${(u.sub_expire||'').slice(0,10)||'-'}</td><td>${u.is_active?'active':'inactive'}</td><td><button onclick="fillUser('${u.email}')">Edit</button> <button onclick="delUser('${u.email}')">Padam</button></td></tr>`).join('');
}

function renderSubs(){
  document.getElementById('subsRows').innerHTML=users.map(u=>{const d=daysLeft(u.sub_expire);return `<tr><td>${u.email}</td><td>${u.sub_expire||'-'}</td><td>${d===null?'-':d}</td><td>${followBtn(u)}</td></tr>`}).join('');
}

function fillUser(email){const u=users.find(x=>x.email===email); if(!u) return; uName.value=u.full_name||''; uEmail.value=u.email||''; uPlan.value=u.sub_plan||'basic'; uStart.value=(u.sub_start||'').slice(0,10); uExpire.value=(u.sub_expire||'').slice(0,10); uActive.value=String(!!u.is_active); show('add');}

async function saveUser(){
  const payload={email:uEmail.value.trim(),fullName:uName.value.trim(),password:uPass.value||'User@1234',subPlan:uPlan.value,subStart:uStart.value||null,subExpire:uExpire.value||null,isActive:uActive.value==='true'};
  if(!payload.email) return msg('Email required');
  if(demoMode){users=users.filter(x=>x.email!==payload.email).concat([{email:payload.email,full_name:payload.fullName,sub_plan:payload.subPlan,sub_start:payload.subStart,sub_expire:payload.subExpire,is_active:payload.isActive}]);localStorage.setItem('demo_users_staff',JSON.stringify(users));msg('User disimpan (demo)');renderKpi();renderTable();renderSubs();show('users');uName.value=uEmail.value=uPass.value='';return;}
  const r=await api('/users/create',{method:'POST',body:JSON.stringify(payload)}); const d=await r.json(); if(!r.ok) return msg(d.error||'Gagal'); msg('User disimpan'); await load(); show('users'); uName.value=uEmail.value=uPass.value='';
}

async function delUser(email){if(!confirm('Padam '+email+'?')) return; if(demoMode){users=users.filter(x=>x.email!==email);localStorage.setItem('demo_users_staff',JSON.stringify(users));renderKpi();renderTable();renderSubs();return;} const r=await api('/users/'+encodeURIComponent(email),{method:'DELETE'}); const d=await r.json(); if(!r.ok) return msg(d.error||'Gagal'); load();}

async function load(){
  if(!demoMode){const r=await api('/users/list');const d=await r.json();if(!r.ok)return msg(d.error||'No access');users=d.users||[];}
  renderKpi(); renderTable(); renderSubs();
}

load();
</script>
</body>
</html>
